<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{color-scheme:light;--ink:#182338;--muted:#607086;--blue:#2458c4;--line:#dce3ee;--soft:#f0f5ff}
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:var(--ink);font:16px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:1040px;margin:28px auto;padding:36px 44px;background:#fff;border:1px solid var(--line);border-radius:16px}
h1{font-size:30px;line-height:1.35;margin:8px 0 14px;letter-spacing:-.02em}h2{font-size:21px;margin:0 0 12px}p{margin:10px 0}a{color:var(--blue);text-underline-offset:3px;overflow-wrap:anywhere}
.meta,.note{font-size:14px;color:var(--muted)}.lead{font-size:18px;border-left:4px solid var(--blue);padding:10px 16px;background:var(--soft);border-radius:0 8px 8px 0}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}nav a{font-size:14px;padding:4px 10px;border:1px solid var(--line);border-radius:6px;text-decoration:none}
section{margin-top:28px;scroll-margin-top:20px}ul,ol{padding-left:24px;margin:8px 0}.highlights li{margin:6px 0}.highlights li::marker{color:var(--blue)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin:12px 0;max-width:100%}table{border-collapse:collapse;width:100%;font-size:15px}caption{padding:10px 14px;text-align:left;color:var(--muted);font-size:13px;background:#fafbfe}th,td{padding:12px 14px;text-align:left;vertical-align:top;border-top:1px solid var(--line);overflow-wrap:anywhere;min-width:100px}th{background:var(--soft);font-weight:600}tbody tr:nth-child(even){background:#fafbfe}td:first-child{font-weight:600}
.badge{display:inline-block;font-size:13px;border-radius:5px;padding:1px 7px;white-space:nowrap}.priority{background:#eaf1ff;color:#204fba}.secondary{background:#f0f3f7;color:#536174}.background{background:#f6f6f6;color:#737373}
details{border:1px solid var(--line);border-radius:9px;margin:10px 0;background:#fff}summary{cursor:pointer;padding:12px 15px;font-weight:600}summary:focus-visible{outline:3px solid #b1c9ff;outline-offset:2px}.detail-body{padding:0 16px 14px;border-top:1px solid var(--line)}.answer{padding:12px 16px;background:#fafcff;border-radius:0 0 9px 9px}.review{margin-top:20px;font-size:14px;color:var(--muted)}footer{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
@media(max-width:640px){body{font-size:15px}main{margin:0;padding:22px 16px;border:0;border-radius:0}h1{font-size:25px}h2{font-size:19px}.lead{font-size:16px}th,td{padding:10px;min-width:100px}nav{gap:6px}}
@media print{body{background:#fff;font-size:11pt}main{margin:0;padding:0;border:0;max-width:none}nav{display:none}h1{font-size:22pt}h2{font-size:15pt}details{break-inside:auto}details>summary{display:list-item!important}details>:not(summary){display:block!important}details::details-content{content-visibility:visible!important;height:auto!important}table{font-size:10pt}tr{break-inside:avoid}thead{display:table-header-group}.table-wrap{overflow:visible}th,td{min-width:0;padding:7px}a{color:inherit}.badge{border:1px solid #aaa}}
</style>
</head>
<body><main>{{BODY}}</main></body>
</html>
